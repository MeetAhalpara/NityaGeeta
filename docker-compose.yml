version: '3.8'

services:
  # =============================================================================
  # Fast-API Production Backend Service
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nityageeta-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nityageeta-net

  # =============================================================================
  # In-Memory Cache Service (Redis 7.2)
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: nityageeta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nityageeta-net

volumes:
  redis_data:

networks:
  nityageeta-net:
    driver: bridge

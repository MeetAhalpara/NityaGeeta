---
# =============================================================================
# NityaGeeta — Enterprise Production Node Provisioning Playbook
# Sets up Docker, Kernel Tuning, UFW Firewall (Ports 1866 & 1870), and Non-Root Users
# =============================================================================
- name: Provision and Harden NityaGeeta Production Worker Nodes
  hosts: production_nodes
  become: yes
  vars:
    app_user: "appuser"
    app_uid: 10001
    backend_port: 1866
    frontend_port: 1870

  tasks:
    - name: 1. Update APT package index and upgrade existing packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: 2. Install essential system dependencies
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - ufw
          - fail2ban
          - htop
        state: present

    - name: 3. Create dedicated non-root application group and user (UID 10001)
      group:
        name: "{{ app_user }}"
        gid: "{{ app_uid }}"
        state: present

    - name: 4. Create application user without shell login
      user:
        name: "{{ app_user }}"
        uid: "{{ app_uid }}"
        group: "{{ app_user }}"
        shell: /usr/sbin/nologin
        create_home: no

    - name: 5. Configure Linux Kernel parameters for high network throughput (sysctl)
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: "net.core.somaxconn", value: "65535" }
        - { name: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
        - { name: "vm.max_map_count", value: "262144" }

    - name: 6. Install Docker Engine
      shell: |
        curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: 7. Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: 8. Configure UFW Firewall rules (SSH, HTTP, HTTPS, Sacred Ports 1866 & 1870)
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22", proto: "tcp" }      # SSH
        - { port: "80", proto: "tcp" }      # HTTP
        - { port: "443", proto: "tcp" }     # HTTPS
        - { port: "{{ backend_port }}", proto: "tcp" }   # Sacred Backend API (1866)
        - { port: "{{ frontend_port }}", proto: "tcp" }  # Sacred Frontend BFF (1870)

    - name: 9. Enable UFW Firewall
      ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: 10. Verify Docker daemon is healthy
      command: docker info
      register: docker_status
      changed_when: false

    - name: 11. Display provisioning summary
      debug:
        msg: "Node {{ inventory_hostname }} provisioned with Docker and Ports {{ backend_port }} & {{ frontend_port }} open."

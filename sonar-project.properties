# Project Identification
sonar.projectKey=meetahalpara_nityageeta
sonar.organization=meetahalpara
sonar.projectName=NityaGeeta
sonar.projectVersion=1.0

# Source & Test Code Locations
sonar.sources=api,frontend/src
sonar.tests=tests

# File Inclusions & Encodings
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12

# Crucial Exclusions (Prevents scanning bulky datasets, virtual environments, drafts & diagnostics)
sonar.exclusions=\
  **/.venv/**,\
  **/node_modules/**,\
  **/rakazo/**,\
  **/data/**,\
  frontend/.next/**,\
  frontend/public/**,\
  **/*.json,\
  **/*.txt,\
  IT-Diagnostics-Suite/**

# Test Coverage Integration
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

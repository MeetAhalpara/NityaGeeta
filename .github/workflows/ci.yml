name: NityaGeeta Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend (FastAPI and Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Python Code Syntax Verification
        run: |
          python -m compileall api/

      - name: Run RAG and Verse Index Integrity Tests
        run: |
          python -c "
          import sys
          from api.services.verse_index import _tokenize, SYN
          print('Verse index tokenization test passed.')
          assert len(SYN) > 50, 'SYN dictionary missing entries!'
          print('Synonym dictionary verification passed.')
          "

  frontend-checks:
    name: Frontend (Next.js 15 and React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Type Check
        run: |
          npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_AUTH_API_BASE: http://localhost:8000
          NEXTAUTH_SECRET: ci-dummy-nextauth-secret-for-build-verification
          NEXTAUTH_URL: http://localhost:1870
        run: |
          npm run build

  dataset-integrity:
    name: Scripture Dataset Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Canonical JSON Scripture Files
        run: |
          python -c "
          import json, os

          data_dir = 'data/output'
          expected_files = [
              'gita_editions/gita_press_translated.json',
              'gita_editions/The Bhagavad Gita Winthrop Sargeant (Word-for-Word English).json',
              'gita_editions/Gita-Sadhak-Sanjevani-English.json',
              'gita_editions/Bhagavad Gita with the Commentary of Adi Shankaracharya.json',
              'veducation_books/boss_ocr.json'
          ]

          for rel_path in expected_files:
              full_path = os.path.join(data_dir, rel_path)
              assert os.path.exists(full_path), f'Missing scripture dataset: {full_path}'
              with open(full_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
                  assert len(data) > 0, f'Dataset empty: {full_path}'
                  print(f'Verified {rel_path} ({len(data)} items)')

          print('All scripture datasets verified successfully!')
          "

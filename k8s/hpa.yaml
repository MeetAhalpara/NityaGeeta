apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nityageeta-backend-hpa
  namespace: nityageeta
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nityageeta-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nityageeta-frontend-hpa
  namespace: nityageeta
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nityageeta-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
